name: ${DOCETRA_COMPOSE_PROJECT:-docetra-backend}

services:
  api:
    image: ${DOCETRA_BACKEND_IMAGE:-docetra-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-backend.env.example}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-docetra}:${POSTGRES_PASSWORD:-docetra_local_only}@postgres:5432/${POSTGRES_DB:-docetra}
      REDIS_URL: redis://redis:6379/0
      CACHE_SHORT_URL: redis://redis:6379/1
      CACHE_LONG_URL: redis://redis:6379/2
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-docetra}:${RABBITMQ_PASSWORD:-docetra_rabbit_local_only}@rabbitmq:5672/${RABBITMQ_VHOST:-docetra}
      S3_ENDPOINT: http://minio:9000
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - private

  worker:
    image: ${DOCETRA_BACKEND_IMAGE:-docetra-backend:local}
    restart: unless-stopped
    command: ["sh", "-c", "${BACKEND_WORKER_COMMAND:-python -m app.worker}"]
    env_file:
      - ${BACKEND_ENV_FILE:-backend.env.example}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-docetra}:${POSTGRES_PASSWORD:-docetra_local_only}@postgres:5432/${POSTGRES_DB:-docetra}
      REDIS_URL: redis://redis:6379/0
      CACHE_SHORT_URL: redis://redis:6379/1
      CACHE_LONG_URL: redis://redis:6379/2
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-docetra}:${RABBITMQ_PASSWORD:-docetra_rabbit_local_only}@rabbitmq:5672/${RABBITMQ_VHOST:-docetra}
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - private

  scheduler:
    image: ${DOCETRA_BACKEND_IMAGE:-docetra-backend:local}
    restart: unless-stopped
    command: ["sh", "-c", "${BACKEND_SCHEDULER_COMMAND:-python -m app.scheduler}"]
    env_file:
      - ${BACKEND_ENV_FILE:-backend.env.example}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-docetra}:${POSTGRES_PASSWORD:-docetra_local_only}@postgres:5432/${POSTGRES_DB:-docetra}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-docetra}:${RABBITMQ_PASSWORD:-docetra_rabbit_local_only}@rabbitmq:5672/${RABBITMQ_VHOST:-docetra}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - private

  postgres:
    image: ${POSTGRES_IMAGE:-postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docetra}
      POSTGRES_USER: ${POSTGRES_USER:-docetra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docetra_local_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - private

  redis:
    image: ${REDIS_IMAGE:-redis@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - private

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq@sha256:44bf7eb50fe1765885659e49ccfdc775f8e531964d979321aee380a071f49f94}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-docetra}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-docetra_rabbit_local_only}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-docetra}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - private

  minio:
    image: ${MINIO_IMAGE:-minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-docetra}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-docetra_minio_local_only}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - private

  postgres-backup:
    image: ${POSTGRES_IMAGE:-postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73}
    profiles: ["operations"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-docetra}
      PGUSER: ${POSTGRES_USER:-docetra}
      PGPASSWORD: ${POSTGRES_PASSWORD:-docetra_local_only}
    volumes:
      - backend_backups:/backups
    entrypoint: ["sh", "-c"]
    command: ["pg_dump --format=custom --file=/backups/docetra-$$(date -u +%Y%m%dT%H%M%SZ).dump"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private

  minio-backup:
    image: ${MINIO_MC_IMAGE:-minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727}
    profiles: ["operations"]
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-docetra}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-docetra_minio_local_only}
      S3_BUCKET: ${S3_BUCKET:-docetra}
    volumes:
      - backend_backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /backups/minio && mc alias set source http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" && mc mirror --overwrite source/\"$$S3_BUCKET\" /backups/minio"]
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - private

networks:
  edge:
  private:
    internal: true

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  backend_backups:
