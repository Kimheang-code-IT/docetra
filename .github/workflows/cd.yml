name: CD

on:
  # Build images and (on main) deploy only after CI succeeds.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the built images to production
        type: boolean
        default: true

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    name: Merge tested dev into main
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Fast-forward or merge into main
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          if git merge-base --is-ancestor origin/main "$TESTED_SHA"; then
            git merge --ff-only "$TESTED_SHA"
          else
            git merge --no-ff "$TESTED_SHA" -m "ci: merge tested dev (${TESTED_SHA:0:7}) into main"
          fi
          git push origin main

  build:
    name: Build and push images (GHCR)
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.refs.outputs.backend_image }}
      frontend_image: ${{ steps.refs.outputs.frontend_image }}
      image_tag: ${{ steps.refs.outputs.image_tag }}
      sha: ${{ steps.refs.outputs.sha }}
      branch: ${{ steps.refs.outputs.branch }}
    steps:
      - name: Resolve refs + image tags
        id: refs
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
            BRANCH="${{ github.event.workflow_run.head_branch }}"
          else
            SHA="${{ github.sha }}"
            BRANCH="${{ github.ref_name }}"
          fi
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHORT="${SHA:0:7}"
          BACKEND="ghcr.io/$OWNER/docetra-backend"
          FRONTEND="ghcr.io/$OWNER/docetra-frontend"

          IMAGE_TAG="sha-$SHORT"
          BACKEND_TAGS="$BACKEND:$IMAGE_TAG,$BACKEND:$BRANCH"
          FRONTEND_TAGS="$FRONTEND:$IMAGE_TAG,$FRONTEND:$BRANCH"
          if [ "$BRANCH" = "main" ]; then
            BACKEND_TAGS="$BACKEND_TAGS,$BACKEND:latest"
            FRONTEND_TAGS="$FRONTEND_TAGS,$FRONTEND:latest"
          fi

          {
            echo "sha=$SHA"
            echo "branch=$BRANCH"
            echo "image_tag=$IMAGE_TAG"
            echo "backend_image=$BACKEND:$IMAGE_TAG"
            echo "frontend_image=$FRONTEND:$IMAGE_TAG"
            echo "backend_tags=$BACKEND_TAGS"
            echo "frontend_tags=$FRONTEND_TAGS"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.refs.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.refs.outputs.backend_tags }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.refs.outputs.frontend_tags }}
          build-args: |
            NUXT_PUBLIC_SITE_URL=${{ vars.NUXT_PUBLIC_SITE_URL || 'https://docetra.minidev.in' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to production (pull images)
    needs: build
    # Deploy the CI-tested commit. A GITHUB_TOKEN push to main (promote) does not
    # trigger workflows, so production is deployed from the tested main/dev run.
    if: >-
      (github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'dev'))
      || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check deploy secret
        id: guard
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "::warning title=Deploy skipped::DEPLOY_SSH_KEY is not set. Add the deploy secrets from docs/DEPLOYMENT.md to enable CD."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH (pull-only)
        if: steps.guard.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || '167.71.244.107' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL || 'http://127.0.0.1:8080/ready' }}
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE || 'infrastructure/.env.production' }}
          TARGET_SHA: ${{ needs.build.outputs.sha }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build.outputs.frontend_image }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER || github.actor }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_DIR='$DEPLOY_PATH' SHA='$TARGET_SHA' ENV_FILE='$DEPLOY_ENV_FILE' HEALTH_URL='$DEPLOY_HEALTH_URL' IMAGE_TAG='$IMAGE_TAG' BACKEND_IMAGE='$BACKEND_IMAGE' FRONTEND_IMAGE='$FRONTEND_IMAGE' GHCR_TOKEN='$GHCR_TOKEN' GHCR_USER='$GHCR_USER' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          echo "Deploying $IMAGE_TAG ($SHA)"

          git fetch --prune origin
          git checkout --force "$SHA"

          if [ -n "${GHCR_TOKEN:-}" ]; then
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          fi

          export DOCETRA_BACKEND_IMAGE="$BACKEND_IMAGE"
          export DOCETRA_FRONTEND_IMAGE="$FRONTEND_IMAGE"

          # Pull-only: images are built in CI and never on the server.
          docker compose --env-file "$ENV_FILE" -f infrastructure/docker-compose.yml pull api worker telegram nginx
          docker compose --env-file "$ENV_FILE" -f infrastructure/docker-compose.yml up -d --no-build --remove-orphans
          docker image prune -f

          echo "Waiting for readiness: $HEALTH_URL"
          for i in $(seq 1 30); do
            if curl -sf "$HEALTH_URL" >/dev/null; then echo "ready"; exit 0; fi
            sleep 2
          done
          echo "::error::Service did not become ready at $HEALTH_URL"
          docker compose --env-file "$ENV_FILE" -f infrastructure/docker-compose.yml ps
          docker compose --env-file "$ENV_FILE" -f infrastructure/docker-compose.yml logs api --tail 100
          exit 1
          REMOTE
