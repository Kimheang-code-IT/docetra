name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    name: Unit + contract + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Backend unit/contract
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
          python -m pytest -q

      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend install + typecheck + unit
        working-directory: frontend
        run: |
          pnpm install
          pnpm typecheck
          pnpm test:unit

  integration:
    name: Live API integration (Docker)
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare backend.env
        run: |
          cp backend.env.example backend.env
          # Ensure local secrets exist for Compose.
          grep -q '^SESSION_SECRET=' backend.env || echo 'SESSION_SECRET=ci_session_secret_change_me_32chars' >> backend.env
          grep -q '^PASSWORD_RESET_SECRET=' backend.env || echo 'PASSWORD_RESET_SECRET=ci_reset_secret_change_me_32chars' >> backend.env
          grep -q '^JWT_SECRET=' backend.env || echo 'JWT_SECRET=ci_jwt_secret_change_me_32_chars_xx' >> backend.env

      - name: Start Docker stack
        env:
          DOCETRA_BACKEND_IMAGE: docetra-backend:ci
        run: |
          docker compose --env-file backend.env -f compose.backend.yml build api
          docker compose --env-file backend.env -f compose.backend.yml up -d
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/ready >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file backend.env -f compose.backend.yml logs api --tail 100
          exit 1

      - name: Integration tests
        working-directory: backend
        env:
          DOCETRA_API_BASE: http://127.0.0.1:8000
          ADMIN_EMAIL: admin@gmail.com
          ADMIN_PASSWORD: "123456"
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
          python -m pytest tests/integration -m integration -q --tb=short

      - name: Tear down
        if: always()
        env:
          DOCETRA_BACKEND_IMAGE: docetra-backend:ci
        run: docker compose --env-file backend.env -f compose.backend.yml down -v

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v5

      - name: Prepare backend.env
        run: |
          cp backend.env.example backend.env
          grep -q '^SESSION_SECRET=' backend.env || echo 'SESSION_SECRET=ci_session_secret_change_me_32chars' >> backend.env
          grep -q '^PASSWORD_RESET_SECRET=' backend.env || echo 'PASSWORD_RESET_SECRET=ci_reset_secret_change_me_32chars' >> backend.env
          grep -q '^JWT_SECRET=' backend.env || echo 'JWT_SECRET=ci_jwt_secret_change_me_32_chars_xx' >> backend.env

      - name: Start Docker API
        env:
          DOCETRA_BACKEND_IMAGE: docetra-backend:ci
        run: |
          docker compose --env-file backend.env -f compose.backend.yml build api
          docker compose --env-file backend.env -f compose.backend.yml up -d
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/ready && break
            sleep 2
          done

      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend install + Playwright
        working-directory: frontend
        env:
          # Empty NUXT_PUBLIC_API_BASE from .env.example; Node preset honors /api/v2 proxy to Docker :8000.
          NITRO_PRESET: node
        run: |
          set -euo pipefail
          cp .env.example .env
          pnpm install
          pnpm exec playwright install chromium --with-deps
          pnpm build
          # nuxt preview [dir] treats --host 127.0.0.1 as a directory (looks for frontend/127.0.0.1/.output).
          NODE_ENV=production HOST=127.0.0.1 PORT=3000 node .output/server/index.mjs &
          preview_pid=$!
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000 >/dev/null; then
              echo "Preview ready"
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              echo "Preview process exited before becoming ready"
              wait "$preview_pid" || true
              exit 1
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:3000 >/dev/null
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 DOCETRA_API_BASE=http://127.0.0.1:8000 pnpm test:e2e

      - name: Tear down
        if: always()
        env:
          DOCETRA_BACKEND_IMAGE: docetra-backend:ci
        run: docker compose --env-file backend.env -f compose.backend.yml down -v

  promote:
    name: Merge tested dev into main
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fast-forward or merge into main
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          if git merge-base --is-ancestor origin/main "$TESTED_SHA"; then
            git merge --ff-only "$TESTED_SHA"
          else
            git merge --no-ff "$TESTED_SHA" -m "ci: merge tested dev (${TESTED_SHA:0:7}) into main"
          fi
          git push origin main
