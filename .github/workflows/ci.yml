name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    name: Unit + contract + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Secret scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Backend lint + unit/contract + coverage
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
          ruff check app tests
          python -m compileall -q app
          python -m pytest -q --cov=app --cov-report=xml --cov-report=term --cov-fail-under=35

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend install + lint + typecheck + unit coverage
        working-directory: frontend
        run: |
          pnpm install
          pnpm lint
          pnpm typecheck
          pnpm test:unit --coverage

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  integration:
    name: Live API integration (Docker)
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Prepare backend.env
        run: |
          cp backend.env.example backend.env
          # Ensure local secrets exist for Compose.
          grep -q '^SESSION_SECRET=' backend.env || echo 'SESSION_SECRET=ci_session_secret_change_me_32chars' >> backend.env
          grep -q '^PASSWORD_RESET_SECRET=' backend.env || echo 'PASSWORD_RESET_SECRET=ci_reset_secret_change_me_32chars' >> backend.env
          grep -q '^JWT_SECRET=' backend.env || echo 'JWT_SECRET=ci_jwt_secret_change_me_32_chars_xx' >> backend.env
          echo 'SEED_BOOTSTRAP_ADMIN=true' >> backend.env

      - name: Start Docker stack
        env:
          DOCETRA_BACKEND_IMAGE: docetra-backend:ci
        run: |
          docker compose --env-file backend.env -f compose.backend.yml build api
          docker compose --env-file backend.env -f compose.backend.yml up -d
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/ready >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file backend.env -f compose.backend.yml logs api --tail 100
          exit 1

      - name: Integration tests
        working-directory: backend
        env:
          DOCETRA_API_BASE: http://127.0.0.1:8000
          ADMIN_EMAIL: admin@gmail.com
          ADMIN_PASSWORD: "123456"
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
          python -m pytest tests/integration -m integration -q --tb=short

      - name: Tear down
        if: always()
        env:
          DOCETRA_BACKEND_IMAGE: docetra-backend:ci
        run: docker compose --env-file backend.env -f compose.backend.yml down -v

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Prepare backend.env
        run: |
          cp backend.env.example backend.env
          grep -q '^SESSION_SECRET=' backend.env || echo 'SESSION_SECRET=ci_session_secret_change_me_32chars' >> backend.env
          grep -q '^PASSWORD_RESET_SECRET=' backend.env || echo 'PASSWORD_RESET_SECRET=ci_reset_secret_change_me_32chars' >> backend.env
          grep -q '^JWT_SECRET=' backend.env || echo 'JWT_SECRET=ci_jwt_secret_change_me_32_chars_xx' >> backend.env
          echo 'SEED_BOOTSTRAP_ADMIN=true' >> backend.env

      - name: Start Docker API
        env:
          DOCETRA_BACKEND_IMAGE: docetra-backend:ci
        run: |
          docker compose --env-file backend.env -f compose.backend.yml build api
          docker compose --env-file backend.env -f compose.backend.yml up -d
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/ready >/dev/null; then
              echo "API ready"
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/ready >/dev/null

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend install + Playwright
        working-directory: frontend
        env:
          # Empty NUXT_PUBLIC_API_BASE from .env.example; Node preset honors /api/v2 proxy to Docker :8000.
          NITRO_PRESET: node-server
        run: |
          set -euo pipefail
          cp .env.example .env
          pnpm install
          pnpm exec playwright install chromium --with-deps
          pnpm build
          test -f .output/server/index.mjs
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 DOCETRA_API_BASE=http://127.0.0.1:8000 pnpm test:e2e

      - name: Tear down
        if: always()
        env:
          DOCETRA_BACKEND_IMAGE: docetra-backend:ci
        run: docker compose --env-file backend.env -f compose.backend.yml down -v

  promote:
    name: Merge tested dev into main
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Fast-forward or merge into main
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          if git merge-base --is-ancestor origin/main "$TESTED_SHA"; then
            git merge --ff-only "$TESTED_SHA"
          else
            git merge --no-ff "$TESTED_SHA" -m "ci: merge tested dev (${TESTED_SHA:0:7}) into main"
          fi
          git push origin main
