name: CI/CD

on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but never interrupt an in-flight deploy on a push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fast:
    name: Unit + contract + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Secret scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Backend lint + unit/contract + coverage
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
          ruff check app tests
          python -m compileall -q app
          python -m pytest -q --cov=app --cov-report=xml --cov-report=term --cov-fail-under=35

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend install + lint + typecheck + unit coverage
        working-directory: frontend
        run: |
          pnpm install
          pnpm lint
          pnpm typecheck
          pnpm test:unit --coverage

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  integration:
    name: Live API integration (Docker)
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Prepare infrastructure env
        run: |
          cp infrastructure/.env.example infrastructure/.env
          # Ensure local secrets exist for Compose.
          grep -q '^SESSION_SECRET=' infrastructure/.env || echo 'SESSION_SECRET=ci_session_secret_change_me_32chars' >> infrastructure/.env
          grep -q '^PASSWORD_RESET_SECRET=' infrastructure/.env || echo 'PASSWORD_RESET_SECRET=ci_reset_secret_change_me_32chars' >> infrastructure/.env
          grep -q '^JWT_SECRET=' infrastructure/.env || echo 'JWT_SECRET=ci_jwt_secret_change_me_32_chars_xx' >> infrastructure/.env

      - name: Start Docker stack
        env:
          DOCETRA_BACKEND_IMAGE: docetra-backend:ci
        run: |
          docker compose --env-file infrastructure/.env -f infrastructure/docker-compose.yml build api
          docker compose --env-file infrastructure/.env -f infrastructure/docker-compose.yml up -d
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/ready >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file infrastructure/.env -f infrastructure/docker-compose.yml logs api --tail 100
          exit 1

      - name: Integration tests
        working-directory: backend
        env:
          DOCETRA_API_BASE: http://127.0.0.1:8000
          ADMIN_EMAIL: admin@docetra.test
          ADMIN_PASSWORD: "Docetra-Admin-2025"
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
          python -m pytest tests/integration -m integration -q --tb=short

      - name: Tear down
        if: always()
        env:
          DOCETRA_BACKEND_IMAGE: docetra-backend:ci
        run: docker compose --env-file infrastructure/.env -f infrastructure/docker-compose.yml down -v

  migrations:
    name: Alembic migration cycle
    runs-on: ubuntu-latest
    needs: fast
    services:
      postgres:
        image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: docetra
          POSTGRES_USER: docetra
          POSTGRES_PASSWORD: docetra
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U docetra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install backend test deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Alembic upgrade/downgrade cycle
        working-directory: backend
        env:
          MIGRATION_DATABASE_URL: postgresql+psycopg://docetra:docetra@127.0.0.1:55432/docetra
        run: python -m pytest tests/integration/test_migrations.py -m migration -q --tb=short

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: [integration, migrations]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Prepare infrastructure env
        run: |
          cp infrastructure/.env.example infrastructure/.env
          grep -q '^SESSION_SECRET=' infrastructure/.env || echo 'SESSION_SECRET=ci_session_secret_change_me_32chars' >> infrastructure/.env
          grep -q '^PASSWORD_RESET_SECRET=' infrastructure/.env || echo 'PASSWORD_RESET_SECRET=ci_reset_secret_change_me_32chars' >> infrastructure/.env
          grep -q '^JWT_SECRET=' infrastructure/.env || echo 'JWT_SECRET=ci_jwt_secret_change_me_32_chars_xx' >> infrastructure/.env

      - name: Start Docker API
        env:
          DOCETRA_BACKEND_IMAGE: docetra-backend:ci
        run: |
          docker compose --env-file infrastructure/.env -f infrastructure/docker-compose.yml build api
          docker compose --env-file infrastructure/.env -f infrastructure/docker-compose.yml up -d
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/ready >/dev/null; then
              echo "API ready"
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/ready >/dev/null

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend install + Playwright
        working-directory: frontend
        env:
          # Empty NUXT_PUBLIC_API_BASE from .env.example; Node preset honors /api/v2 proxy to Docker :8000.
          NITRO_PRESET: node-server
        run: |
          set -euo pipefail
          cp .env.example .env
          pnpm install
          pnpm exec playwright install chromium --with-deps
          pnpm build
          test -f .output/server/index.mjs
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 DOCETRA_API_BASE=http://127.0.0.1:8000 pnpm test:e2e

      - name: Tear down
        if: always()
        env:
          DOCETRA_BACKEND_IMAGE: docetra-backend:ci
        run: docker compose --env-file infrastructure/.env -f infrastructure/docker-compose.yml down -v

  promote:
    name: Merge tested dev into main
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Fast-forward or merge into main
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          if git merge-base --is-ancestor origin/main "$TESTED_SHA"; then
            git merge --ff-only "$TESTED_SHA"
          else
            git merge --no-ff "$TESTED_SHA" -m "ci: merge tested dev (${TESTED_SHA:0:7}) into main"
          fi
          git push origin main

  # Continuous deployment: only after the full test suite (incl. Playwright) passes.
  # Configure the secrets listed in docs/DEPLOYMENT.md before enabling.
  deploy:
    name: Deploy to production
    needs: e2e
    if: |
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check deploy secret
        id: guard
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "::warning title=Deploy skipped::DEPLOY_SSH_KEY is not set. Add the deploy secrets from docs/DEPLOYMENT.md to enable CD."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.guard.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || '149.248.1.175' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL || 'http://127.0.0.1:8080/ready' }}
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE || 'infrastructure/.env.production' }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_DIR='$DEPLOY_PATH' SHA='$TESTED_SHA' ENV_FILE='$DEPLOY_ENV_FILE' HEALTH_URL='$DEPLOY_HEALTH_URL' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          echo "Deploying $SHA"
          git fetch --prune origin
          git checkout --force "$SHA"
          docker compose --env-file "$ENV_FILE" -f infrastructure/docker-compose.yml build
          docker compose --env-file "$ENV_FILE" -f infrastructure/docker-compose.yml up -d --remove-orphans
          docker image prune -f
          echo "Waiting for readiness: $HEALTH_URL"
          for i in $(seq 1 30); do
            if curl -sf "$HEALTH_URL" >/dev/null; then echo "ready"; exit 0; fi
            sleep 2
          done
          echo "::error::Service did not become ready at $HEALTH_URL"
          docker compose --env-file "$ENV_FILE" -f infrastructure/docker-compose.yml ps
          docker compose --env-file "$ENV_FILE" -f infrastructure/docker-compose.yml logs api --tail 100
          exit 1
          REMOTE
