name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fast:
    name: Unit + contract + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Secret scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Backend lint + unit/contract + coverage
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
          ruff check app tests
          python -m compileall -q app
          python -m pytest -q --cov=app --cov-report=xml --cov-report=term --cov-fail-under=35

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend install + lint + typecheck + unit coverage
        working-directory: frontend
        run: |
          pnpm install
          pnpm lint
          pnpm typecheck
          pnpm test:unit --coverage

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  integration:
    name: Live API integration (Docker)
    runs-on: ubuntu-latest
    needs: fast
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Prepare infrastructure env
        run: |
          cp infrastructure/.env.example infrastructure/.env
          # Ensure local secrets exist for Compose.
          grep -q '^SESSION_SECRET=' infrastructure/.env || echo 'SESSION_SECRET=ci_session_secret_change_me_32chars' >> infrastructure/.env
          grep -q '^PASSWORD_RESET_SECRET=' infrastructure/.env || echo 'PASSWORD_RESET_SECRET=ci_reset_secret_change_me_32chars' >> infrastructure/.env
          grep -q '^JWT_SECRET=' infrastructure/.env || echo 'JWT_SECRET=ci_jwt_secret_change_me_32_chars_xx' >> infrastructure/.env

      - name: Start Docker stack
        env:
          DOCETRA_BACKEND_IMAGE: docetra-backend:ci
        run: |
          docker compose --env-file infrastructure/.env -f infrastructure/docker-compose.yml build api
          # Only the services integration tests need (avoids building/pulling the SPA edge).
          docker compose --env-file infrastructure/.env -f infrastructure/docker-compose.yml up -d postgres redis rabbitmq minio api
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/ready >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file infrastructure/.env -f infrastructure/docker-compose.yml logs api --tail 100
          exit 1

      - name: Integration tests
        working-directory: backend
        env:
          DOCETRA_API_BASE: http://127.0.0.1:8000
          ADMIN_EMAIL: admin@docetra.test
          ADMIN_PASSWORD: "Docetra-Admin-2025"
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
          python -m pytest tests/integration -m integration -q --tb=short

      - name: Tear down
        if: always()
        env:
          DOCETRA_BACKEND_IMAGE: docetra-backend:ci
        run: docker compose --env-file infrastructure/.env -f infrastructure/docker-compose.yml down -v

  migrations:
    name: Alembic migration cycle
    runs-on: ubuntu-latest
    needs: fast
    services:
      postgres:
        image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: docetra
          POSTGRES_USER: docetra
          POSTGRES_PASSWORD: docetra
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U docetra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install backend test deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Alembic upgrade/downgrade cycle
        working-directory: backend
        env:
          MIGRATION_DATABASE_URL: postgresql+psycopg://docetra:docetra@127.0.0.1:55432/docetra
        run: python -m pytest tests/integration/test_migrations.py -m migration -q --tb=short
