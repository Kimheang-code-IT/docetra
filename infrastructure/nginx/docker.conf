# Docetra — containerized edge proxy (local / single-box Docker).
# Mounted as /etc/nginx/conf.d/default.conf by infrastructure/docker-compose.yml.
#
#   browser :$HTTP_PORT ─┬─ /                     → static SPA (/usr/share/nginx/html)
#                        ├─ /api/ /health /ready → api:8000 (FastAPI)
#                        └─ /healthz             → 200 (container healthcheck)
#
# The SPA is built with `NUXT_STATIC_SPA=true` and no Node runtime is needed.
# HTTP only on purpose (local). For a real domain with TLS, terminate at the
# host nginx using infrastructure/nginx/docetra.conf.example instead.

# Docker embedded DNS. Using a variable below forces re-resolution so nginx
# keeps working after the `api` container is recreated with a new IP.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Internal liveness probe used by the nginx Compose healthcheck.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Must match backend MAX_UPLOAD_SIZE_MB (25 MB + multipart overhead).
    client_max_body_size 26m;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Hashed build assets are immutable.
    location /_nuxt/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # --- FastAPI (same-origin /api/v2) -------------------------------------
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # File exports/downloads can be slow to stream.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /health {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location = /ready {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # --- Static SPA + history-mode fallback --------------------------------
    # Nuxt emits each prerendered route as `<route>/index.html` plus a shared
    # `200.html` shell. Prefer `$uri/index.html` so routes are served without a
    # trailing-slash redirect; `$uri` covers files, `200.html` covers dynamic
    # routes like `/records/{typeCode}`.
    location / {
        try_files $uri/index.html $uri $uri/ /200.html;

        # Mirrors the Nuxt routeRules headers/CSP that no longer apply in a
        # static build. Keep in sync with frontend/nuxt.config.ts.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-site always;
        add_header X-Permitted-Cross-Domain-Policies none always;
    }
}
