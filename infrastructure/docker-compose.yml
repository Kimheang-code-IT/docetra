# Docetra full stack for local + small single-box deploys (~20 users):
#   nginx (static SPA + API edge) + api (+ APScheduler) + worker + telegram + postgres + redis + rabbitmq + minio
# Worker and telegram run as separate processes. APScheduler runs in the API via SCHEDULER_IN_API.
#
# The .env file next to this compose file is the ONE source of truth for
# container env AND ${...} interpolation (Compose auto-loads it from this
# directory). Production: copy .env.example to .env.production, fill it in,
# and run with: docker compose --env-file .env.production -f docker-compose.yml up -d
name: ${DOCETRA_COMPOSE_PROJECT:-docetra-backend}

services:
  api:
    image: ${DOCETRA_BACKEND_IMAGE:-docetra-backend:local}
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-docetra}:${POSTGRES_PASSWORD:-docetra_local_only}@postgres:5432/${POSTGRES_DB:-docetra}
      REDIS_URL: redis://redis:6379/0
      CACHE_SHORT_URL: redis://redis:6379/1
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-docetra}:${RABBITMQ_PASSWORD:-docetra_rabbit_local_only}@rabbitmq:5672/${RABBITMQ_VHOST:-docetra}
      S3_ENDPOINT: http://minio:9000
      # Small stack: run APScheduler inside the API (no separate scheduler container).
      SCHEDULER_IN_API: "true"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - private

  # Single edge entry point: serves the static SPA and proxies /api/ → FastAPI.
  # Built from frontend/ (static export baked into an nginx image) — no Node
  # runtime container.
  nginx:
    image: ${DOCETRA_FRONTEND_IMAGE:-docetra-frontend:local}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - edge

  worker:
    image: ${DOCETRA_BACKEND_IMAGE:-docetra-backend:local}
    restart: unless-stopped
    command: ["sh", "-c", "${BACKEND_WORKER_COMMAND:-python -m app.main worker}"]
    env_file:
      - ${BACKEND_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-docetra}:${POSTGRES_PASSWORD:-docetra_local_only}@postgres:5432/${POSTGRES_DB:-docetra}
      REDIS_URL: redis://redis:6379/0
      CACHE_SHORT_URL: redis://redis:6379/1
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-docetra}:${RABBITMQ_PASSWORD:-docetra_rabbit_local_only}@rabbitmq:5672/${RABBITMQ_VHOST:-docetra}
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # edge is required for outbound internet: SMTP, Telegram, Google Drive.
    # private is internal-only and would block those integrations.
    networks:
      - edge
      - private

  # Dedicated Telegram bot (long polling). Isolated from worker job load so
  # many users chatting never compete with exports/Drive/notifications.
  telegram:
    image: ${DOCETRA_BACKEND_IMAGE:-docetra-backend:local}
    restart: unless-stopped
    command: ["sh", "-c", "${BACKEND_TELEGRAM_COMMAND:-python -m app.main telegram}"]
    env_file:
      - ${BACKEND_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-docetra}:${POSTGRES_PASSWORD:-docetra_local_only}@postgres:5432/${POSTGRES_DB:-docetra}
      REDIS_URL: redis://redis:6379/0
      CACHE_SHORT_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Outbound internet only (Telegram API); DB/Redis are on edge too.
    networks:
      - edge

  postgres:
    image: ${POSTGRES_IMAGE:-postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docetra}
      POSTGRES_USER: ${POSTGRES_USER:-docetra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docetra_local_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Host bind for DBeaver / local clients (loopback only).
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - edge
      - private

  redis:
    image: ${REDIS_IMAGE:-redis@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    # Host bind for redis-cli / GUI tools (loopback only).
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - edge
      - private

  # Single-node broker is enough for ~20 users. Management UI on :15672 (loopback).
  # Override RABBITMQ_IMAGE to pin a digest in shared environments.
  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:3.13-management-alpine}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-docetra}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-docetra_rabbit_local_only}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-docetra}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - edge
      - private

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-docetra}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-docetra_minio_local_only}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - edge
      - private

  postgres-backup:
    image: ${POSTGRES_IMAGE:-postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73}
    profiles: ["operations"]
    restart: "no"
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-docetra}
      PGUSER: ${POSTGRES_USER:-docetra}
      PGPASSWORD: ${POSTGRES_PASSWORD:-docetra_local_only}
    volumes:
      - backend_backups:/backups
    entrypoint: ["sh", "-c"]
    command: ["pg_dump --format=custom --file=/backups/docetra-$$(date -u +%Y%m%dT%H%M%SZ).dump"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private

  minio-backup:
    image: ${MINIO_MC_IMAGE:-quay.io/minio/mc:latest}
    profiles: ["operations"]
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-docetra}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-docetra_minio_local_only}
      S3_BUCKET: ${S3_BUCKET:-docetra}
    volumes:
      - backend_backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /backups/minio && mc alias set source http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" && mc mirror --overwrite source/\"$$S3_BUCKET\" /backups/minio"]
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - private

networks:
  edge:
  private:
    internal: true

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  backend_backups:
