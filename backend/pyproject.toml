[project]
name = "docetra-backend"
version = "1.0.0"
description = "Docetra API, worker, and scheduler"
requires-python = ">=3.12"
dependencies = [
  "aio-pika==9.5.7",
  "alembic==1.16.5",
  "apscheduler==3.11.0",
  "asyncpg==0.30.0",
  "bcrypt==4.0.1",
  "cryptography==45.0.7",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "itsdangerous==2.2.0",
  "minio==7.2.16",
  "passlib[bcrypt]==1.7.4",
  "PyJWT==2.10.1",
  "psycopg[binary]==3.2.10",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "redis==6.4.0",
  "sqlalchemy[asyncio]==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.1", "pytest-asyncio==1.1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
cache_dir = "/tmp/pytest-cache"
